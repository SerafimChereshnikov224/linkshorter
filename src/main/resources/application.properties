# Время жизни ссылки в минутах (по умолчанию 1440 = 24 часа)
link.ttl.minutes=1440

# Лимит переходов по умолчанию, если при создании не указан --limit
link.max-visits.default=100

# Максимально допустимый лимит переходов
link.max-visits.max=1000000

# Каталог для хранения данных (ссылки, уведомления, сессия)
storage.dir=data

# Отображаемый префикс коротких ссылок
shortlink.prefix=sho.rt/
