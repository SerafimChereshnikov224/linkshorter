# Link lifetime in minutes (default: 1440 = 24 hours)
link.ttl.minutes=1440

# Visits limit used when --limit is not specified
link.max-visits.default=100

# Upper bound for the visits limit
link.max-visits.max=1000000

# Storage directory (links, notifications, session)
storage.dir=data

# Short code length in characters
shortlink.code.length=7

# Display prefix for short links
shortlink.prefix=sho.rt/
